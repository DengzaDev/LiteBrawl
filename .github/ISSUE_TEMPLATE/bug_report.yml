name: Bug 报告
description: 插件行为异常、报错、或者配置不生效
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        **先做这三件事**，能解决大部分「看起来是 bug」的情况：

        1. 升级插件后行为没变 → 删掉 `plugins/.paper-remapped/<插件名>-<版本>.jar` 再启动（Paper 会复用旧缓存）
        2. 改了配置没生效 → 大部分键 `/litebrawl reload` 即可，`storage.type` 必须重启
        3. 假人看不见 → 世界难度是 `peaceful` 时僵尸会被立刻清除，改成 `easy` 或更高

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 说清你期望的结果和实际的结果。
      placeholder: 期望：踩竹马赛克立刻死亡。实际：站上去没有反应，血量没掉。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写，越具体越好。涉及配置的话把相关那一段贴出来。
      placeholder: |
        1. /maps create arena1 测试图
        2. /map setspawn
        3. /start 进场
        4. 站到 BAMBOO_MOSAIC 上
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        `logs/latest.log` 里和报错有关的部分。有异常栈一定贴完整（从 `Exception` 那行往下）。
        没有异常也请说明，这本身就是重要信息。
      render: text

  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: 1.0.2-Release
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: 服务端版本
      description: 例如 Paper 1.21.1 build 133
      placeholder: Paper 1.21.1
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 相关配置
      description: 只贴出和问题有关的那一段，不要整份贴（里面有数据库密码和 web.token）。
      render: yaml

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我搜过已有 issue，没有重复
          required: true
        - label: 我贴的日志 / 配置里没有数据库密码、web.token 等敏感信息
          required: true
