name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0.1）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建
        run: mvn -B -ntp package

      - name: 打包热更新示例
        run: |
          cd tools/hotfix-src
          zip -q -r "$GITHUB_WORKSPACE/target/LiteBrawl-$RELEASE_TAG.hotfix" hotfix.yml
          ls -l "$GITHUB_WORKSPACE/target"

      - name: 提取当前版本的更新说明
        run: |
          VERSION="${RELEASE_TAG#v}"
          # CHANGELOG 里每节以 "## <版本>" 开头；只截取当前版本那一节，
          # 否则 Release 页面会把所有历史版本一起搬上去。
          awk -v ver="$VERSION" '
            BEGIN { pat = "^## " ver "([^0-9]|$)" }
            $0 ~ pat { flag = 1; print; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md 里找不到 ## ${VERSION}，退回使用整份文件"
            cp CHANGELOG.md release-notes.md
          fi
          echo "本次 Release 说明：$(wc -l < release-notes.md) 行"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LiteBrawl ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            target/LiteBrawl-*.jar
            target/*.hotfix
