name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建
        run: mvn -B -ntp package

      - name: 打包热更新示例
        run: |
          cd tools/hotfix-src
          zip -q -r "$GITHUB_WORKSPACE/target/LiteBrawl-${{ github.ref_name }}.hotfix" hotfix.yml
          ls -l "$GITHUB_WORKSPACE/target"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: LiteBrawl ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            target/LiteBrawl-*.jar
            target/*.hotfix
